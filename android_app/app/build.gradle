plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zjw.visitorqrregister'
    compileSdk 34

    defaultConfig {
        applicationId 'com.zjw.visitorqrregister'
        minSdk 31
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        debugStable {
            storeFile file('keystore/debug-signing.p12')
            storePassword 'visitor_debug_pass'
            keyAlias 'visitor_debug'
            keyPassword 'visitor_debug_pass'
            storeType 'pkcs12'
        }
    }

    buildTypes {
        debug {
            debuggable true
            signingConfig signingConfigs.debugStable
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
}
