name: Android Debug APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Prepare release APK
        run: |
          mkdir -p release
          TAG_NAME="${GITHUB_REF_NAME}"
          cp app/build/outputs/apk/debug/*.apk "release/visitor-qr-register-${TAG_NAME}.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: visitor-qr-register-debug-apk
          path: android_app/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android_app/release/*.apk
          generate_release_notes: true
